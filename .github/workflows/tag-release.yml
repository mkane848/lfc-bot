name: Tag release

# Cutting a release is a merged pull request that bumps the version in
# package.json (`npm version X.Y.Z --no-git-tag-version`) and moves the
# changelog's Unreleased entries under that version. After a CI run passes on
# main, this tags `vX.Y.Z` on the commit that set that version, if the tag
# doesn't exist yet and CI passed on that commit too, then runs the release
# workflow to publish the image and the GitHub Release. Every other CI run on
# main finds the tag already there and does nothing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize runs so two quick pushes can't both try to create the same tag.
# GitHub keeps only the newest pending run and cancels the others, which loses
# nothing: whichever run goes ahead tags the same release commit.
concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag a new package.json version
    # Only a green CI run for a push to main: never a pull request's run, and
    # never a commit whose CI failed.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history, to find the commit that set the version.
          fetch-depth: 0

      - name: Create the tag if this version has none
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi

          # release.yml always moves :latest, so only plain releases are
          # tagged here. Tag a pre-release by hand instead.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$version is not a plain X.Y.Z release; not tagging it."
            exit 0
          fi

          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Add one before releasing $tag."
            exit 1
          fi

          # Tag the commit that set this version, not the commit whose CI run
          # triggered this workflow. Otherwise a pull request merged just after
          # the release rides into it: v1.6.2 was tagged on a dependency bump
          # merged 12 seconds after the release, because that bump's CI
          # finished first.
          release_sha="$(git log --first-parent -1 --format=%H -S"\"version\": \"$version\"" -- package.json)"
          if [ -z "$release_sha" ]; then
            echo "::error::Could not find the commit that set version $version in package.json."
            exit 1
          fi

          # Only once CI has passed on that commit itself. If it hasn't yet,
          # stop: a passing CI run on it starts this workflow again.
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$release_sha&status=success&per_page=1" --jq '.total_count')"
          if [ "$passed" = "0" ]; then
            echo "CI hasn't passed on $release_sha, which set $version; not tagging $tag yet."
            exit 0
          fi

          git tag "$tag" "$release_sha"
          git push origin "refs/tags/$tag"
          echo "Tagged $release_sha as $tag."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
