name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking: production dependencies only. Fails the build on any
      # high/critical vulnerability that ships in the runtime image.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Non-blocking: covers dev-only tooling (vitest/vite/esbuild/drizzle-kit
      # chain), which is stripped from the production image and not worth
      # gating merges on. Visible in the log for awareness.
      - name: Audit all dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test
