name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-blocking for now: fixing the current findings requires breaking
      # major-version upgrades (drizzle-orm, drizzle-kit, vitest, node-cron).
      # Flip to blocking once those are addressed.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test
