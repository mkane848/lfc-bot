services:
  bot:
    build:
      context: .
    image: lfcbot:latest
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - lfcbot-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  lfcbot-data:
